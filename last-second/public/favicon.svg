<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="dialBg" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#171924" />
      <stop offset="68%" stop-color="#0d0f17" />
      <stop offset="100%" stop-color="#06070b" />
    </radialGradient>
    <linearGradient id="brassRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="48%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <linearGradient id="crimsonHand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fda4af" />
      <stop offset="50%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#9f1239" />
    </linearGradient>
    <radialGradient id="sparkGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#fef08a" />
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Rounded Watchcase Base -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="#07080d" stroke="#272a3a" stroke-width="8" />

  <!-- Outer Bezel & Dial -->
  <circle cx="256" cy="256" r="212" fill="url(#dialBg)" stroke="url(#brassRim)" stroke-width="10" />
  <circle cx="256" cy="256" r="194" fill="none" stroke="#c8a96e" stroke-opacity="0.28" stroke-width="2" stroke-dasharray="6 10" />

  <!-- Skeleton Escapement Gear -->
  <g transform="translate(256 256)" stroke="#d97706" stroke-opacity="0.32" fill="none">
    <circle r="126" stroke-width="14" stroke-dasharray="18 15" />
    <circle r="112" stroke-width="2.5" />
    <circle r="76" stroke-width="1.8" stroke-dasharray="5 5" />
    <!-- Hairspring Spiral Approximation -->
    <path d="M 0,0 C 12,-12 24,8 18,22 C 8,40 -26,34 -34,12 C -44,-18 -16,-52 16,-54 C 52,-56 74,-18 66,22 C 56,64 6,86 -38,72" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- 12 Hour Indices & XII Numeral -->
  <g transform="translate(256 256)" fill="#fde68a">
    <text x="0" y="-158" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="34" letter-spacing="2">XII</text>
    <text x="166" y="12" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="28">III</text>
    <text x="0" y="182" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="28">VI</text>
    <text x="-166" y="12" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="28">IX</text>
    <line x1="88" y1="-152" x2="98" y2="-170" stroke="#c8a96e" stroke-width="5" stroke-linecap="round" />
    <line x1="152" y1="-88" x2="170" y2="-98" stroke="#c8a96e" stroke-width="5" stroke-linecap="round" />
    <line x1="152" y1="88" x2="170" y2="98" stroke="#c8a96e" stroke-width="5" stroke-linecap="round" />
    <line x1="88" y1="152" x2="98" y2="170" stroke="#c8a96e" stroke-width="5" stroke-linecap="round" />
    <line x1="-88" y1="152" x2="-98" y2="170" stroke="#c8a96e" stroke-width="5" stroke-linecap="round" />
    <line x1="-152" y1="88" x2="-170" y2="98" stroke="#c8a96e" stroke-width="5" stroke-linecap="round" />
    <line x1="-152" y1="-88" x2="-170" y2="-98" stroke="#c8a96e" stroke-width="5" stroke-linecap="round" />
    <line x1="-88" y1="-152" x2="-98" y2="-170" stroke="#c8a96e" stroke-width="5" stroke-linecap="round" />
  </g>

  <!-- Danger Sector Wedge (55s -> 60s Final Second) -->
  <path d="M 256 256 L 162 84 A 196 196 0 0 1 256 60 Z" fill="#f43f5e" fill-opacity="0.24" />

  <!-- Safe Escapement Zone (Ice Cyan Double Ring + Diamond) -->
  <g transform="translate(342 156)">
    <circle r="38" fill="#38bdf8" fill-opacity="0.16" stroke="#38bdf8" stroke-width="3.5" stroke-dasharray="8 6" />
    <circle r="28" fill="none" stroke="#bae6fd" stroke-width="1.5" />
  </g>

  <!-- Sweeping Crimson Second Hand -->
  <g transform="translate(256 256) rotate(-24)">
    <polygon points="-7,56 7,56 3,-188 -3,-188" fill="url(#crimsonHand)" />
    <circle cx="0" cy="42" r="11" fill="none" stroke="#fda4af" stroke-width="4" />
  </g>

  <!-- Center Ruby Jewel Pivot -->
  <circle cx="256" cy="256" r="16" fill="#fbbf24" />
  <circle cx="256" cy="256" r="9" fill="#e11d48" stroke="#fff1f2" stroke-width="2" />

  <!-- Glowing Time Spark & Comet Trail -->
  <path d="M 252 318 Q 296 258 336 168" fill="none" stroke="#38bdf8" stroke-opacity="0.65" stroke-width="10" stroke-linecap="round" />
  <path d="M 252 318 Q 296 258 336 168" fill="none" stroke="#fef08a" stroke-opacity="0.85" stroke-width="4" stroke-linecap="round" />
  <g transform="translate(336 168)">
    <circle r="38" fill="url(#sparkGlow)" />
    <path d="M 0,-22 L 5,-5 L 22,0 L 5,5 L 0,22 L -5,5 L -22,0 L -5,-5 Z" fill="#ffffff" />
  </g>
</svg>
